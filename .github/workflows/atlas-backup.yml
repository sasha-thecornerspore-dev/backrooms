name: Atlas backup

# The atlas's live data (beacons and their strata, presence marks at day resolution) lives in one Durable Object on the
# relay and nowhere else. Once a week this reads the public view and keeps a copy on gh-pages under atlas/backup/, so a
# lost or re-created worker can be re-seeded from the last snapshot (relay/atlas-seed.js is the genesis; this is the
# archive since). The public read is exactly what anyone can GET, so nothing private is written anywhere.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  RELAY: https://backrooms-relay.jeff-schatz112.workers.dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Fetch the atlas
        run: |
          mkdir -p atlas/backup
          curl -fsS --max-time 30 "$RELAY/atlas/beacons" -o /tmp/beacons.json
          node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/beacons.json","utf8")); if(!Array.isArray(j.beacons)||!j.beacons.length) process.exit(1); console.log("beacons:", j.beacons.length, "strata:", j.beacons.reduce((n,b)=>n+(b.strata||[]).length,0))'
          cp /tmp/beacons.json atlas/backup/beacons-latest.json
          cp /tmp/beacons.json "atlas/backup/beacons-$(date -u +%F).json"
          # keep the last 12 dated snapshots
          ls -1 atlas/backup/beacons-20*.json 2>/dev/null | sort | head -n -12 | xargs -r git rm -q --
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A atlas/backup
          git diff --cached --quiet && { echo "atlas unchanged"; exit 0; }
          git commit -m "atlas: weekly backup $(date -u +%F)"
          git push origin gh-pages
