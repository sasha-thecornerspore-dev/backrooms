name: Build & Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Write build config
        run: |
          echo '{"wishToken":"${{ secrets.GITHUB_ISSUES_TOKEN }}","githubOwner":"${{ github.repository_owner }}","githubRepo":"backrooms"}' > src/build-config.json

      - name: Build & sign installer
        env:
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:          ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:  ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release
