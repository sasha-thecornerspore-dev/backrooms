name: Build & Release

# push to main  -> build Windows / Linux / macOS installers into a DRAFT release, publish it once
#                  every required asset has landed (updaters never see a half-uploaded release)
# pull request  -> build all three the same way, attach them to the run as artifacts, publish nothing
# manual run    -> same as a pull request (a dry run of the installers from any branch)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag:     ${{ steps.guard.outputs.tag }}
      build:   ${{ steps.guard.outputs.build }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      # Skip only when this version is already fully PUBLISHED.
      # A leftover draft from a failed run is NOT skipped — the build re-uploads into the same
      # draft (--clobber), so releases stay repairable. Docs-only pushes after a good release
      # just skip cleanly.
      - name: Check for existing release
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a push to main — building installers without publishing."
            echo "build=true"    >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IS_DRAFT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo "missing")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Release $TAG is already published — skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # release notes: docs/release-notes/<tag>.md when it exists (written with the version bump), else empty
          NOTES="docs/release-notes/$TAG.md"
          if [ "$IS_DRAFT" = "missing" ]; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --draft --title "$VER" --notes-file "$NOTES" --target "${{ github.sha }}" --repo "${{ github.repository }}"
            else
              gh release create "$TAG" --draft --title "$VER" --notes "" --target "${{ github.sha }}" --repo "${{ github.repository }}"
            fi
          elif [ -f "$NOTES" ]; then
            gh release edit "$TAG" --notes-file "$NOTES" --repo "${{ github.repository }}"   # a leftover draft picks up edited notes
          fi
          echo "Draft $TAG ready — building."
          echo "build=true"   >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            assets: "dist/*.exe dist/*.exe.blockmap dist/latest.yml"
          - os: ubuntu-latest
            platform: linux
            assets: "dist/*.AppImage dist/*.deb dist/latest-linux.yml dist/backrooms-web-*.zip"
          # macOS builds are ad-hoc signed (no Apple Developer ID yet): they run after the player
          # clears Gatekeeper once, and the app points mac players at the release page instead of
          # self-installing. A mac-only failure must not hold back the Windows/Linux release.
          - os: macos-latest
            platform: mac
            assets: "dist/*.dmg dist/*.zip dist/*.zip.blockmap dist/latest-mac.yml"
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # npm install (not ci): npm 10 writes inconsistent lockfiles for rollup's
      # optional native/WASM deps, which trips `npm ci`. install reconciles it.
      - run: npm install --no-audit --no-fund

      # the suite is platform-neutral; once is enough (Linux, the same runner wish-auto tests on)
      - if: matrix.platform == 'linux'
        run: npm test

      # only release builds carry the wish token; PR/dry-run installers submit wishes as a silent no-op
      - name: Write build config
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          echo '{"wishToken":"${{ secrets.ISSUES_TOKEN }}","githubOwner":"${{ github.repository_owner }}","githubRepo":"backrooms"}' > src/build-config.json

      - name: Build & sign installer (Windows)
        if: matrix.platform == 'win'
        env:
          CSC_LINK:         ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Build installers (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist:linux

      # CSC_* is deliberately NOT passed here: it holds the Windows .pfx, which macOS signing would reject
      - name: Build installers (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Bundle server
        if: matrix.platform == 'linux'
        run: npx esbuild server/index.js --bundle --platform=node --format=esm --outfile=dist/backrooms-server.js --external:ws

      # the browser build zipped for itch.io and the other portals: no counter, no service worker, relative paths, nothing from
      # the build config (tools/build-itch.sh checks each). A run attaches it; a release carries it, and the itch job pushes it.
      - name: Build the browser zip (itch.io)
        if: matrix.platform == 'linux'
        run: bash tools/build-itch.sh src "dist/backrooms-web-$(node -p "require('./package.json').version").zip"

      - name: Collect assets
        id: assets
        shell: bash
        run: |
          shopt -s nullglob
          FILES=()
          for pat in ${{ matrix.assets }}; do
            matches=( $pat )
            if [ ${#matches[@]} -eq 0 ]; then echo "::error::no file matched $pat"; exit 1; fi
            FILES+=( "${matches[@]}" )
          done
          [ "${{ matrix.platform }}" = "linux" ] && FILES+=( dist/backrooms-server.js )
          printf '%s\n' "${FILES[@]}"
          { echo 'files<<EOF'; printf '%s\n' "${FILES[@]}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Upload to draft release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t FILES <<< "${{ steps.assets.outputs.files }}"
          gh release upload "${{ needs.prepare.outputs.tag }}" "${FILES[@]}" --clobber --repo "${{ github.repository }}"

      - name: Attach installers to the run
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-${{ matrix.platform }}
          path: ${{ steps.assets.outputs.files }}
          retention-days: 14

  # Publish only after every required asset has landed. Until now the release was a draft, invisible
  # to updaters. (macOS is optional — see the matrix — so a mac-only failure still publishes.)
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"

  # The itch.io mirror (growth-spec §3): once the GitHub release is public, push the same files to itch with butler
  # (itch.io/docs/butler). It runs only behind the publish job's own gate, never blocks or changes the GitHub release, and skips
  # cleanly (a notice, a green check) until the owner adds the BUTLER_API_KEY secret. Secrets cannot be read in `if:`, so the
  # key rides job env and the first step tests it (docs.github.com, "Using secrets"). The key is never echoed.
  itch:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # OWNER: confirm the itch project (user/game, lower case, from its URL) — set the ITCH_GAME repo variable to override this default
      ITCH_GAME: ${{ vars.ITCH_GAME || 'sasha-thecornerspore/the-backrooms' }}
      BUTLER_VERSION: '15.32.0'   # broth.itch.zone LATEST on 2026-10-13; bump on purpose, never float
      BUTLER_SHA256: ''           # pin it after the first run prints it (no checksum is published)
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Is itch.io set up?
        id: gate
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::notice title=itch.io::push skipped: add the BUTLER_API_KEY secret to turn it on (the project is $ITCH_GAME)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch this release's files
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --dir rel \
            --pattern '*.exe' --pattern '*.AppImage' --pattern '*-universal.zip' --pattern 'backrooms-web-*.zip'
          ls -la rel

      - name: Install butler (pinned)
        if: steps.gate.outputs.go == 'true'
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          if [ -n "$BUTLER_SHA256" ]; then echo "$BUTLER_SHA256  butler.zip" | sha256sum -c -
          else echo "::warning title=butler::checksum not pinned yet: $(sha256sum butler.zip | cut -d' ' -f1)"; fi
          unzip -q butler.zip -d "$RUNNER_TEMP/butler" && chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler/butler" -V

      # channels: windows / linux / mac take their platform tag from the name; html5 is marked "played in the browser" once, by
      # hand, on the itch edit page. A build missing from the release (mac is optional) is a warning, never a failure.
      - name: Push to itch.io
        if: steps.gate.outputs.go == 'true'
        run: |
          VER="${TAG#v}"
          shopt -s nullglob
          one() { # a channel, then its files, pushed from a folder of their own
            local ch="$1"; shift
            if [ $# -eq 0 ]; then echo "::warning title=itch.io::nothing to push to $ch"; return 0; fi
            mkdir -p "push/$ch" && cp "$@" "push/$ch/" && chmod +x "push/$ch"/*
            butler push "push/$ch" "$ITCH_GAME:$ch" --userversion "$VER" --if-changed
          }
          zipped() { # a channel, then one zip, pushed as its contents (butler unzips it): the mac .app, the web build's index.html at the root
            local ch="$1"; shift
            if [ $# -eq 0 ]; then echo "::warning title=itch.io::nothing to push to $ch"; return 0; fi
            butler push "$1" "$ITCH_GAME:$ch" --userversion "$VER" --if-changed
          }
          one windows rel/*.exe
          one linux   rel/*.AppImage
          zipped mac   rel/*-universal.zip
          zipped html5 rel/backrooms-web-*.zip
