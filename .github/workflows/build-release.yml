name: Build & Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # npm install (not ci): npm 10 writes inconsistent lockfiles for rollup's
      # optional native/WASM deps, which trips `npm ci`. install reconciles it.
      - run: npm install --no-audit --no-fund

      # Skip only when this version is already fully PUBLISHED.
      # A leftover draft from a failed run is NOT skipped — electron-builder
      # reuses the draft and we retry the upload, so releases stay repairable.
      # (docs-only pushes to main after a good release just skip cleanly.)
      - name: Check for existing release
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IS_DRAFT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || echo "missing")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Release $TAG is already published — skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No published release for $TAG (state: $IS_DRAFT) — building."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write build config
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          echo '{"wishToken":"${{ secrets.ISSUES_TOKEN }}","githubOwner":"${{ github.repository_owner }}","githubRepo":"backrooms"}' > src/build-config.json

      - name: Build & sign installer
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:          ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:  ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release

      - name: Bundle server
        if: steps.guard.outputs.exists == 'false'
        run: npx esbuild server/index.js --bundle --platform=node --format=esm --outfile=dist/backrooms-server.js --external:ws

      - name: Upload server to release
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.guard.outputs.tag }}" dist/backrooms-server.js --clobber --repo "${{ github.repository }}"

      # Publish only after every asset (installer, latest.yml, blockmap, server)
      # has landed. Until now the release was a draft, invisible to updaters.
      - name: Publish the release
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.guard.outputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
