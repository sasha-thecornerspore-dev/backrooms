name: Grant Wish

on:
  issues:
    types: [labeled]

jobs:
  grant:
    if: github.event.label.name == 'granted'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Call Claude (subscription) to modify world.json
        id: claude
        env:
          # Runs on the maintainer's Claude SUBSCRIPTION via Claude Code, not a
          # pay-per-token API key. Set CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code

          WORLD=$(cat src/renderer/world.json)
          SYS='You are the living atmosphere of the Backrooms. You receive a wish from a wanderer and modify a world config JSON to reflect it. You must return ONLY valid JSON matching the input schema exactly — no prose, no markdown, no code fences, and DO NOT use any tools. Be subtle. The Backrooms never changes obviously — it drifts. Small shifts in palette, fog, flicker, audio frequency, item scarcity, or message pool are more unsettling than large ones.'
          # printf %s keeps world.json / the wish as literal text — a variable's
          # value is never re-parsed by bash, so neither can inject shell.
          PROMPT=$(printf '%s\n\nCurrent world.json:\n%s\n\nWish: %s\n\nReturn the modified world.json.' "$SYS" "$WORLD" "$ISSUE_BODY")

          ENVELOPE=$(claude -p "$PROMPT" --model sonnet --output-format json --allowed-tools "" 2>/dev/null || true)
          NEW_WORLD=$(printf '%s' "$ENVELOPE" | jq -r '.result // empty' 2>/dev/null | sed -e 's/^```json$//' -e 's/^```$//')

          if [ -z "$NEW_WORLD" ] || ! printf '%s' "$NEW_WORLD" | jq empty >/dev/null 2>&1; then
            echo "Claude returned no usable JSON. Envelope was:" >&2
            printf '%s' "$ENVELOPE" | head -c 800 >&2
            exit 1
          fi

          printf '%s\n' "$NEW_WORLD" > src/renderer/world.json

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/\[wish\] //g' | tr -cs 'a-z0-9' '-' | cut -c1-40 | sed 's/-$//')
          BRANCH="wish/${ISSUE_NUM}-${SLUG}"

          # Patch-bump so the merge produces a release that updaters actually see
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/renderer/world.json package.json package-lock.json
          git commit -m "spirits: grant wish #${ISSUE_NUM} (v${NEW_VERSION})"
          git push origin "$BRANCH"

          BODY=$(printf 'Closes #%s\n\nWish: %s\n\nReview `src/renderer/world.json` diff before merging. Edit the file in this PR if the drift needs adjustment. Merging releases v%s.' "$ISSUE_NUM" "$ISSUE_BODY" "$NEW_VERSION")

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "spirits: grant wish #${ISSUE_NUM}" \
            --body "$BODY"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" \
            --body "the spirits have considered your request. a PR has been opened for review."
