<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gfx harness</title>
<style>html, body { margin: 0; background: #000; overflow: hidden } canvas { display: block }</style>
</head>
<body>
<script>
// ── determinism shims ─ a classic script, so it runs BEFORE any module is fetched ──────────────
// Math.random is replaced by a seeded PRNG (the particle field uses it). Date.now / performance.now are
// replaced by a frame-stepped fake clock while a SCENE renders, so a renderer that later grows
// time-based animation or an adaptive-quality timer is still reproducible. The benchmark switches
// the real clock back on. (The pristine renderer reads neither clock; grep before assuming otherwise.)
(function () {
  const realNow = performance.now.bind(performance)
  const realDateNow = Date.now
  function mulberry32(seed) {
    let s = seed >>> 0
    return function () {
      s += 0x6D2B79F5
      let t = Math.imul(s ^ (s >>> 15), 1 | s)
      t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }
  let rnd = mulberry32(1)
  Math.random = function () { return rnd() }
  let t = 0
  window.__gfx = {
    realNow,
    seed(n) { rnd = mulberry32(n) },
    clockOn() { t = 0; performance.now = () => t; Date.now = () => 1700000000000 + t },
    clockOff() { performance.now = realNow; Date.now = realDateNow },
    tick(ms = 1000 / 60) { t += ms },
  }
})()
</script>

<script type="module">
import * as S from './scenes.js'

const G = window.__gfx
// "A" is the tree passed as --src; "B" exists only for an A/B benchmark (--bench-vs).
const trees = {}

// The renderer tree under test is loaded from the directory passed to run.mjs (--src), NOT from
// next to this file, so the same harness runs the pristine baseline and a refactored tree.
async function loadTree(srcUrl, worldJson) {
  const imp = (f) => import(new URL(f, srcUrl).href)
  const [renderer, world, levels, fixedmap, nullmap, decor, items, entities] = await Promise.all([
    imp('renderer.js'), imp('world.js'), imp('levels.js'), imp('fixedmap.js'),
    imp('level-null-map.js'), imp('decor.js'), imp('items.js'), imp('entities.js'),
  ])
  const mods = {
    createRenderer: renderer.createRenderer,
    DEFAULT_CONFIG: world.DEFAULT_CONFIG, CHUNK_SIZE: world.CHUNK_SIZE, createChunkCache: world.createChunkCache,
    levelConfig: levels.levelConfig, LEVELS: levels.LEVELS,
    createFixedMap: fixedmap.createFixedMap,
    NULL_MAP: nullmap.NULL_MAP, NULL_SPAWN: nullmap.NULL_SPAWN, NULL_EXIT: nullmap.NULL_EXIT,
    createDecorSystem: decor.createDecorSystem, SIGHT_TYPES: decor.SIGHT_TYPES,
    createItemSystem: items.createItemSystem,
    createEntitySystem: entities.createEntitySystem,
  }
  // same merge game.js does through loadConfig(): DEFAULT_CONFIG <- world.json
  return { mods, base: { ...mods.DEFAULT_CONFIG, ...(worldJson || {}) } }
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas')
  c.width = w; c.height = h
  document.body.appendChild(c)
  return c
}

// Build a scene, and create a fresh renderer for it. `draw()` is exactly one game frame: what game.js
// hands render() (a wall test closed over the player's chunk, the flat entity list, flicker, fog, lights).
function setupScene(scene, size, tree = 'A') {
  const { mods, base } = trees[tree]
  G.seed(S.RNG_SEED)
  const spec = scene.build({ mods, base, size })
  const canvas = makeCanvas(size.w, size.h)
  // renderOpts is the live prefs object game.js shares with the renderer; --quality / --reduce-flicker set the same keys
  const ro = { ...(spec.renderOpts || S.RENDER_OPTS) }
  if (window.__gfxQuality) ro.qualityTier = window.__gfxQuality
  if (window.__gfxReduceFlicker) ro.reduceFlicker = true
  if (window.__gfxRopts) Object.assign(ro, window.__gfxRopts)
  const r = mods.createRenderer(canvas, spec.cfg, ro, spec.hooks || {})
  const pcx = Math.floor(spec.player.x / mods.CHUNK_SIZE), pcy = Math.floor(spec.player.y / mods.CHUNK_SIZE)
  const isWall = (wx, wy) => spec.cache.isWall(wx, wy, pcx, pcy)
  isWall.pcx = pcx; isWall.pcy = pcy; isWall.evictRadius = (spec.cfg && spec.cfg.chunkEvictRadius) ?? 3   // as the game declares it (gfx-world.js memoSafe)
  const draw = () => r.render(spec.player, isWall, spec.flicker ?? 1, spec.entities || [], spec.fogMul ?? 1, spec.lights || {}, spec.timing || null)
  return { canvas, r, spec, draw }
}

window.__harness = {
  async init({ srcUrl, worldJson, gpu, vs, quality, reduceFlicker, ropts }) {
    window.__backroomsTestRun = true          // the harness IS a test run: the GL backend honours allowSoftwareGl / __failGl / gpuValidate only with this marker
    window.__gfxRopts = ropts || null
    window.__gfxGpu = !!gpu
    window.__gfxQuality = quality || null
    window.__gfxReduceFlicker = !!reduceFlicker
    trees.A = await loadTree(srcUrl, worldJson)
    if (vs) trees.B = await loadTree(vs.srcUrl, vs.worldJson)
    return {
      worldSeed: S.WORLD_SEED,
      warmupFrames: S.WARMUP_FRAMES,
      scenes: S.SCENES.map((s) => ({ id: s.id, group: s.group || s.id, desc: s.desc })),
      ua: navigator.userAgent,
    }
  },

  // Level-transition stress: create a renderer, draw a few frames and dispose it, `n` times (what game.js does at every level change). Browsers cap live
  // WebGL contexts (~16) and warn 'Too many active WebGL contexts' past it (main.cjs turns that warning into a failure); every sibling canvas must be
  // gone afterwards. Returns what was seen so run.mjs --stress can print it.
  async stress({ n, id }) {
    const scene = S.SCENES.find((s) => s.id === id)
    if (!scene) throw new Error('unknown scene ' + id)
    const size = { w: 320, h: 180 }
    const before = document.querySelectorAll('canvas').length
    const kinds = {}
    for (let i = 0; i < n; i++) {
      const s = setupScene(scene, size)
      try { for (let f = 0; f < 3; f++) s.draw(); kinds[s.r.kind] = (kinds[s.r.kind] || 0) + 1 } finally { if (s.r.dispose) s.r.dispose(); s.canvas.remove() }
    }
    return { n, kinds, canvasesBefore: before, canvasesAfter: document.querySelectorAll('canvas').length }
  },

  // Render one scene: WARMUP_FRAMES identical frames (so frame-counter animation and particle
  // positions are the same every run), then export the LAST frame as PNG.
  async renderScene(id, sizeOverride) {
    const scene = S.SCENES.find((s) => s.id === id)
    if (!scene) throw new Error('unknown scene ' + id)
    const size = sizeOverride || scene.size || S.DEFAULT_SIZE
    const t0 = G.realNow()
    G.clockOn()
    let s = null
    try {
      s = setupScene(scene, size)
      const frames = (scene.warmup ?? S.WARMUP_FRAMES) + 1
      for (let i = 0; i < frames; i++) { G.tick(); s.draw() }
      // a GPU renderer draws to a sibling canvas that is only readable through capture(); the CPU one draws on s.canvas
      const png = (s.r.kind === 'gpu' && s.r.capture ? s.r.capture() : s.canvas.toDataURL('image/png')).replace(/^data:image\/png;base64,/, '')
      // kind / why say which backend actually drew the frame: a GPU request that silently fell back to the CPU must not pass for a GPU render
      return { png, width: size.w, height: size.h, ms: G.realNow() - t0, kind: s.r.kind, why: s.r.why, info: s.r.info || null }
    } finally {
      G.clockOff()
      if (s) { if (s.r.dispose) s.r.dispose(); s.canvas.remove() }
    }
  },

  // Per pose, per round: 60 warm-up + 240 measured render() calls, REAL clock, fresh renderer.
  // Two passes per round:
  //   call    - time of the render() call alone (what the spec asks for)
  //   flushed - the same plus a 1x1 getImageData() after each call, which forces Chromium to execute canvas
  //             work it may only have *recorded* (2D ops are deferred until the canvas is read or presented),
  //             i.e. closer to what a displayed frame costs. On a --gpu run the call pass syncs too.
  // Rounds are interleaved across poses (l0, l2, lnull, l0, l2, ...) so machine drift hits all poses alike;
  // the headline number is the median of the per-round medians (p95: median of per-round p95s), and the
  // per-round values are kept so the spread is visible. (performance.now() resolves 0.1 ms in this page.)
  // With a second tree loaded (--bench-vs) each pose is measured on A and B back to back inside every round,
  // alternating which goes first, so B/A ratios are immune to slow machine drift.
  async bench({ w, h, rounds }) {
    const WARM = 60, N = 240
    const size = { w, h }
    const names = trees.B ? ['A', 'B'] : ['A']
    const q = (sorted, p) => sorted[Math.min(sorted.length - 1, Math.ceil(p * sorted.length) - 1)]
    const med = (arr) => q(arr.slice().sort((x, y) => x - y), 0.5)
    const pass = (scene, tree, flushEach) => {
      const s = setupScene(scene, size, tree)
      const ctx = s.canvas.getContext('2d')
      const one = () => { s.draw(); if (flushEach) ctx.getImageData(0, 0, 1, 1) }
      for (let i = 0; i < WARM; i++) one()
      const ts = []
      for (let i = 0; i < N; i++) { const a = G.realNow(); one(); ts.push(G.realNow() - a) }
      if (s.r.dispose) s.r.dispose()
      s.canvas.remove()
      ts.sort((x, y) => x - y)
      return { median: q(ts, 0.5), p95: q(ts, 0.95), mean: ts.reduce((a, b) => a + b, 0) / ts.length, min: ts[0], max: ts[ts.length - 1] }
    }
    const raw = {}
    for (const [name] of S.BENCH) { raw[name] = {}; for (const t of names) raw[name][t] = { call: [], flushed: [] } }
    for (let r = 0; r < rounds; r++) {
      for (const [name, id] of S.BENCH) {
        const scene = S.SCENES.find((x) => x.id === id)
        const order = r % 2 === 0 ? names : names.slice().reverse()
        for (const t of order) {
          raw[name][t].call.push(pass(scene, t, !!window.__gfxGpu))   // a GPU run must always sync, or the numbers mean nothing
          raw[name][t].flushed.push(pass(scene, t, true))
        }
        await new Promise((res) => setTimeout(res, 0))
      }
    }
    const fold = (list) => ({
      medianMs: med(list.map((x) => x.median)), p95Ms: med(list.map((x) => x.p95)), meanMs: med(list.map((x) => x.mean)),
      minMs: Math.min(...list.map((x) => x.min)), maxMs: Math.max(...list.map((x) => x.max)),
      roundMedianMs: list.map((x) => x.median), roundP95Ms: list.map((x) => x.p95),
    })
    const stat = (name, t) => ({ ...fold(raw[name][t].call), flushed: fold(raw[name][t].flushed) })
    const out = { size, warmup: WARM, frames: N, rounds, scenes: {} }
    for (const [name, id] of S.BENCH) out.scenes[name] = { scene: id, ...stat(name, 'A') }
    if (trees.B) {
      out.vs = { scenes: {}, ratio: {} }
      for (const [name, id] of S.BENCH) {
        out.vs.scenes[name] = { scene: id, ...stat(name, 'B') }
        // ratios are taken per round (A and B were measured back to back) and then medianed: robust to drift
        const pair = (kind, key) => med(raw[name].A[kind].map((x, i) => raw[name].B[kind][i][key] / x[key]))
        out.vs.ratio[name] = {
          medianRatio: pair('call', 'median'), p95Ratio: pair('call', 'p95'),
          flushedMedianRatio: pair('flushed', 'median'), flushedP95Ratio: pair('flushed', 'p95'),
          roundMedianRatio: raw[name].A.call.map((x, i) => raw[name].B.call[i].median / x.median),
        }
      }
    }
    return out
  },
}
</script>
</body>
</html>
